name: Publish npm release

on:
  workflow_dispatch:
    inputs:
      npm-tag:
        description: npm dist-tag for the published version
        required: true
        default: next
        type: choice
        options:
          - next
          - latest

permissions:
  contents: read
  id-token: write

concurrency:
  group: npm-stage-${{ github.ref }}
  cancel-in-progress: false

jobs:
  stage:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: "24.15.0"
          registry-url: "https://registry.npmjs.org"
          package-manager-cache: false

      - name: Test package
        run: npm test

      # The human gate is the manual workflow_dispatch itself; publishing
      # authenticates via npm OIDC trusted publishing (id-token above).
      - name: Publish
        env:
          NPM_TAG: ${{ inputs.npm-tag }}
        run: npm publish --tag "$NPM_TAG"
