# Example wiring for the Proofpress action — copy into any repo that vendors
# proofpress.py. One person adds this file once; every teammate gets semantic
# diffs and claim verdicts on their PRs with nothing installed locally.
name: proofpress
on:
  pull_request:

permissions:
  contents: read
  pull-requests: write

jobs:
  proofpress:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      # In this repo we exercise the action from the checked-out source.
      # External repos reference it as: uses: chenmingtang830/proofpress@v0.3.0
      - uses: ./
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
