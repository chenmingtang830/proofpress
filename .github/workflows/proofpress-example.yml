# Example wiring for the Proofpress action — copy into any repo that vendors
# proofpress.py. One person adds this file once; every teammate gets semantic
# diffs and claim verdicts on their PRs with nothing installed locally.
name: proofpress
on:
  pull_request:
    paths: ["**.md", "**.html", "**.htm"]

permissions:
  contents: read
  pull-requests: write

jobs:
  proofpress:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      # In this repo we exercise the action from the checked-out source.
      # External repos reference it as: uses: chenmingtang830/proofpress@main
      - uses: ./
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
