# Example wiring for the Proofpress action — copy into any repo that vendors
# proofpress.py. One person adds this file once; every teammate gets semantic
# diffs and claim verdicts on their PRs with nothing installed locally.
name: proofpress
on:
  pull_request:

permissions:
  contents: read
  pull-requests: write

jobs:
  proofpress:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
      # In this repo we exercise the action from the checked-out source.
      # External repos reference it as: uses: chenmingtang830/proofpress@v0.2.0
      - uses: ./
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
