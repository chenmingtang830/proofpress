<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="526" viewBox="0 0 1120 526" role="img" aria-labelledby="title desc">
  <title id="title">Review and verify an admitted Proofpress revision</title>
  <desc id="desc">Terminal output generated by the Proofpress quickstart.</desc>
  <rect width="1120" height="526" rx="12" fill="#0d1117"/>
  <rect width="1120" height="38" rx="12" fill="#161b22"/>
  <path d="M0 26h1120v12H0z" fill="#161b22"/>
  <circle cx="22" cy="19" r="5" fill="#ff7b72"/>
  <circle cx="40" cy="19" r="5" fill="#d29922"/>
  <circle cx="58" cy="19" r="5" fill="#3fb950"/>
  <style>
    text { font: 14px ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", monospace; white-space: pre; }
    .prompt { fill: #79c0ff; }
    .output { fill: #e6edf3; }
  </style>
  <text class="prompt" x="24" y="62">$ proofpress diff strategy.md</text>
  <text class="output" x="24" y="82">ccad3081 → 22f2374d  ▍ 3 blocks modified  Δ 00.→00</text>
  <text class="output" x="24" y="102"></text>
  <text class="output" x="24" y="122">  ▍ [mod] Saturday schedule (0b451d51)  Δ 00. → 00</text>
  <text class="output" x="24" y="142">        [-Open the garden for-] {+Run+} [-general drop-in volunteer session-] {+focused planting day+} [-12:00.-] {+12:00 for up to twelve volunteers who sign up in advance.+}</text>
  <text class="output" x="24" y="162">  ▍ [mod] Materials (c05650dc)</text>
  <text class="output" x="24" y="182">        [-Ask volunteers to bring gloves;-] {+Pre-stage seedlings and+} {+all+} [-site.-] {+site so the group can begin planting immediately.+}</text>
  <text class="output" x="24" y="202">  ▍ [mod] Success signal (e77d8f45)</text>
  <text class="output" x="24" y="222">        [-the number of-] {+planted beds and returning volunteers, not only total+} [-hours completed.-] {+hours.+}</text>
  <text class="output" x="24" y="242"></text>
  <text class="output" x="24" y="262">  why: a focused session lets organizers prepare materials and test a repeatable planting format</text>
  <text class="output" x="24" y="282">  rejected: open another general drop-in session before testing the focused format</text>
  <text class="output" x="24" y="302">  claims: 3 recorded — `proofpress verify strategy.md 22f2374d`</text>
  <text class="output" x="24" y="322"></text>
  <text class="prompt" x="24" y="342">$ proofpress verify strategy.md</text>
  <text class="output" x="24" y="362">verify strategy.md @ 22f2374d (v2)</text>
  <text class="output" x="24" y="382"></text>
  <text class="output" x="24" y="402">  ✓ [modified] Saturday schedule / para (0b451d51)</text>
  <text class="output" x="24" y="422">  ✓ [modified] Materials / para (c05650dc)</text>
  <text class="output" x="24" y="442">  ✓ [modified] Success signal / para (e77d8f45)</text>
  <text class="output" x="24" y="462"></text>
  <text class="output" x="24" y="482">  3 verified</text>
</svg>
