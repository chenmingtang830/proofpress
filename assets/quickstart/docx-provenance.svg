  <rect width="1324" height="166" rx="12" fill="#0d1117"/>
  <rect width="1324" height="38" rx="12" fill="#161b22"/>
  <path d="M0 26h1324v12H0z" fill="#161b22"/>
  <circle cx="22" cy="19" r="5" fill="#ff7b72"/>
  <circle cx="40" cy="19" r="5" fill="#d29922"/>
  <circle cx="58" cy="19" r="5" fill="#3fb950"/>
  <style>
