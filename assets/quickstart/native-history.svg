<svg xmlns="http://www.w3.org/2000/svg" width="1324" height="466" viewBox="0 0 1324 466" role="img" aria-labelledby="title desc">
  <title id="title">Inspect and import portable Proofpress history</title>
  <desc id="desc">Terminal output generated by the Proofpress quickstart.</desc>
  <rect width="1324" height="466" rx="12" fill="#0d1117"/>
  <rect width="1324" height="38" rx="12" fill="#161b22"/>
  <path d="M0 26h1324v12H0z" fill="#161b22"/>
  <circle cx="22" cy="19" r="5" fill="#ff7b72"/>
  <circle cx="40" cy="19" r="5" fill="#d29922"/>
  <circle cx="58" cy="19" r="5" fill="#3fb950"/>
  <style>
    text { font: 14px ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", monospace; white-space: pre; }
    .prompt { fill: #79c0ff; }
    .output { fill: #e6edf3; }
  </style>
  <text class="prompt" x="24" y="62">$ proofpress inspect strategy.md</text>
  <text class="output" x="24" y="82">warning: proofpress inspect is a maintenance compatibility command; use proofpress legacy inspect (top-level alias removed in 0.7)</text>
  <text class="output" x="24" y="102">inspect strategy.md: ok</text>
  <text class="output" x="24" y="122">  policy: portable</text>
  <text class="output" x="24" y="142">  artifact: pp_da9972109512a811a5eb0c74</text>
  <text class="output" x="24" y="162">  capsule: 2 version(s), head 22f2374d</text>
  <text class="output" x="24" y="182">  head event: ppe_7e451d7a8f202aba69e46419</text>
  <text class="output" x="24" y="202">  provenance: Verifiable revision history by Proofpress</text>
  <text class="output" x="24" y="222">  learn more: https://github.com/chenmingtang830/proofpress</text>
  <text class="output" x="24" y="242">  package: proofpress@latest (user consent required)</text>
  <text class="output" x="24" y="262"></text>
  <text class="prompt" x="24" y="282">$ proofpress import strategy.md</text>
  <text class="output" x="24" y="302">warning: proofpress import is a maintenance compatibility command; use proofpress legacy import (top-level alias removed in 0.7)</text>
  <text class="output" x="24" y="322">imported 2, skipped 0 -&gt; strategy.md (pp_da9972109512a811a5eb0c74)</text>
  <text class="output" x="24" y="342"></text>
  <text class="prompt" x="24" y="362">$ proofpress log strategy.md</text>
  <text class="output" x="24" y="382">warning: proofpress log is a maintenance compatibility command; use proofpress legacy log (top-level alias removed in 0.7)</text>
  <text class="output" x="24" y="402"><tspan fill="#5FB3C4">v2</tspan>  22f2374d  <tspan fill="#787B87">07-24 21:41</tspan>  demo-planning-agent <tspan fill="#787B87">agent</tspan>   <tspan fill="#5FB3C4">● modified 3</tspan></text>
  <text class="output" x="24" y="422"><tspan fill="#5FB3C4">v1</tspan>  ccad3081  <tspan fill="#787B87">07-24 21:40</tspan>  unknown             <tspan fill="#787B87">system</tspan>   <tspan fill="#6FBF8E">+ added 7   </tspan>  portable lineage checkpoint</text>
</svg>
