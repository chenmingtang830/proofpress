<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="406" viewBox="0 0 1120 406" role="img" aria-labelledby="title desc">
  <title id="title">Inspect and import portable Proofpress history</title>
  <desc id="desc">Terminal output generated by the Proofpress quickstart.</desc>
  <rect width="1120" height="406" rx="12" fill="#0d1117"/>
  <rect width="1120" height="38" rx="12" fill="#161b22"/>
  <path d="M0 26h1120v12H0z" fill="#161b22"/>
  <circle cx="22" cy="19" r="5" fill="#ff7b72"/>
  <circle cx="40" cy="19" r="5" fill="#d29922"/>
  <circle cx="58" cy="19" r="5" fill="#3fb950"/>
  <style>
    text { font: 14px ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", monospace; white-space: pre; }
    .prompt { fill: #79c0ff; }
    .output { fill: #e6edf3; }
  </style>
  <text class="prompt" x="24" y="62">$ proofpress inspect strategy.md</text>
  <text class="output" x="24" y="82">inspect strategy.md: ok</text>
  <text class="output" x="24" y="102">  policy: portable</text>
  <text class="output" x="24" y="122">  artifact: pp_da9972109512a811a5eb0c74</text>
  <text class="output" x="24" y="142">  capsule: 2 version(s), head 22f2374d</text>
  <text class="output" x="24" y="162">  head event: ppe_7e451d7a8f202aba69e46419</text>
  <text class="output" x="24" y="182">  provenance: Verifiable revision history by Proofpress</text>
  <text class="output" x="24" y="202">  learn more: https://github.com/chenmingtang830/proofpress</text>
  <text class="output" x="24" y="222">  package: proofpress@latest (user consent required)</text>
  <text class="output" x="24" y="242"></text>
  <text class="prompt" x="24" y="262">$ proofpress import strategy.md</text>
  <text class="output" x="24" y="282">imported 2, skipped 0 -&gt; strategy.md (pp_da9972109512a811a5eb0c74)</text>
  <text class="output" x="24" y="302"></text>
  <text class="prompt" x="24" y="322">$ proofpress log strategy.md</text>
  <text class="output" x="24" y="342">v2  22f2374d  07-24 21:41  demo-planning-agent agent   ● modified 3</text>
  <text class="output" x="24" y="362">v1  ccad3081  07-24 21:40  unknown             system   + added 7     portable lineage checkpoint</text>
</svg>
