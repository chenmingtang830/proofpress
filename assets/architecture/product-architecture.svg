<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 690" role="img" aria-labelledby="architecture-title architecture-desc">
  <title id="architecture-title">Proofpress product architecture</title>
  <desc id="architecture-desc">Agents and applications use MCP, Python, CLI, or HTTP to submit evidence and propose conclusions. Proofpress evaluates the candidate, an owner decides admission, and only eligible governed context returns to successor agents.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#0e6675"/></marker>
    <marker id="green-arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#2f6b54"/></marker>
  </defs>
  <rect width="1200" height="690" fill="#fff"/>
  <rect x="48" y="52" width="1104" height="116" rx="10" fill="#f8f7f3" stroke="#d7dcd9"/>
  <text x="72" y="79" fill="#686f78" font-family="IBM Plex Mono, monospace" font-size="11" font-weight="600" letter-spacing="1.4">WORK LAYER</text>
  <text x="72" y="118" fill="#181a20" font-family="DM Sans, Arial, sans-serif" font-size="24" font-weight="700">Agents and applications</text>
  <text x="72" y="145" fill="#555b66" font-family="DM Sans, Arial, sans-serif" font-size="15">Any model, runtime, provider, or orchestration stack</text>
  <g font-family="IBM Plex Mono, monospace" font-size="13" font-weight="600" text-anchor="middle">
    <rect x="704" y="91" width="92" height="42" rx="5" fill="#fff" stroke="#bfc7c4"/><text x="750" y="117" fill="#181a20">MCP</text>
    <rect x="810" y="91" width="92" height="42" rx="5" fill="#fff" stroke="#bfc7c4"/><text x="856" y="117" fill="#181a20">PYTHON</text>
    <rect x="916" y="91" width="92" height="42" rx="5" fill="#fff" stroke="#bfc7c4"/><text x="962" y="117" fill="#181a20">CLI</text>
    <rect x="1022" y="91" width="92" height="42" rx="5" fill="#fff" stroke="#bfc7c4"/><text x="1068" y="117" fill="#181a20">HTTP</text>
  </g>
  <path d="M600 168V211" fill="none" stroke="#0e6675" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="620" y="194" fill="#0e6675" font-family="IBM Plex Mono, monospace" font-size="11" font-weight="600">EVIDENCE + CANDIDATES</text>
  <rect x="48" y="220" width="1104" height="280" rx="10" fill="#f4f8f8" stroke="#0e6675" stroke-width="1.5"/>
  <text x="72" y="248" fill="#0e6675" font-family="IBM Plex Mono, monospace" font-size="11" font-weight="600" letter-spacing="1.4">PROOFPRESS GOVERNANCE CONTRACT</text>
  <g fill="none" stroke="#0e6675" stroke-width="1.6" marker-end="url(#arrow)"><path d="M254 350H282"/><path d="M470 350H498"/><path d="M686 350H714"/><path d="M902 350H930"/></g>
  <g font-family="DM Sans, Arial, sans-serif">
    <rect x="76" y="292" width="178" height="116" rx="8" fill="#fff" stroke="#d7dcd9"/><text x="96" y="324" fill="#0e6675" font-family="IBM Plex Mono, monospace" font-size="11" font-weight="600">01</text><text x="96" y="355" fill="#181a20" font-size="19" font-weight="700">Evidence</text><text x="96" y="383" fill="#555b66" font-size="14">Bounded support</text>
    <rect x="292" y="292" width="178" height="116" rx="8" fill="#fff" stroke="#d7dcd9"/><text x="312" y="324" fill="#0e6675" font-family="IBM Plex Mono, monospace" font-size="11" font-weight="600">02</text><text x="312" y="355" fill="#181a20" font-size="19" font-weight="700">Conclusion</text><text x="312" y="383" fill="#555b66" font-size="14">Scoped candidate</text>
    <rect x="508" y="292" width="178" height="116" rx="8" fill="#fff" stroke="#d7dcd9"/><text x="528" y="324" fill="#0e6675" font-family="IBM Plex Mono, monospace" font-size="11" font-weight="600">03</text><text x="528" y="355" fill="#181a20" font-size="19" font-weight="700">Checks</text><text x="528" y="383" fill="#555b66" font-size="14">Policy + advice</text>
    <rect x="724" y="292" width="178" height="116" rx="8" fill="#fff" stroke="#0e6675" stroke-width="2"/><text x="744" y="324" fill="#0e6675" font-family="IBM Plex Mono, monospace" font-size="11" font-weight="600">04 · AUTHORITY</text><text x="744" y="355" fill="#181a20" font-size="19" font-weight="700">Owner review</text><text x="744" y="383" fill="#555b66" font-size="14">Admit or reject</text>
    <rect x="940" y="292" width="178" height="116" rx="8" fill="#edf5f0" stroke="#2f6b54"/><text x="960" y="324" fill="#2f6b54" font-family="IBM Plex Mono, monospace" font-size="11" font-weight="600">05</text><text x="960" y="355" fill="#2f6b54" font-size="19" font-weight="700">Governed context</text><text x="960" y="383" fill="#555b66" font-size="14">Eligible knowledge</text>
  </g>
  <text x="72" y="466" fill="#555b66" font-family="DM Sans, Arial, sans-serif" font-size="14">Checks can advise. Only an authenticated human owner grants reuse authority.</text>
  <path d="M1029 500V553H600V584" fill="none" stroke="#2f6b54" stroke-width="2" marker-end="url(#green-arrow)"/>
  <text x="805" y="540" fill="#2f6b54" font-family="IBM Plex Mono, monospace" font-size="11" font-weight="600">ONLY CURRENT · IN-SCOPE · ACTOR-ELIGIBLE</text>
  <rect x="276" y="592" width="648" height="58" rx="8" fill="#181a20"/>
  <text x="600" y="619" text-anchor="middle" fill="#fff" font-family="DM Sans, Arial, sans-serif" font-size="18" font-weight="700">Successor agent or human</text>
  <text x="600" y="639" text-anchor="middle" fill="#c7cbd0" font-family="DM Sans, Arial, sans-serif" font-size="12">Receives governed context, not the full working trace</text>
</svg>
