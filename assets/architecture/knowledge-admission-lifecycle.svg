<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="760" viewBox="0 0 1440 760" role="img" aria-labelledby="title desc">
  <title id="title">Knowledge admission lifecycle</title>
  <desc id="desc">Bound evidence becomes a proposed conclusion, then is evaluated and reviewed. Only the admission gate authorizes a green projection into governed context. Rejected, unresolved, expired, superseded, and actor-mismatched conclusions remain auditable but excluded.</desc>
  <defs>
    <style>.h{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif;fill:#20222B}.s{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif;fill:#5A5D6B}.m{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;fill:#5A5D6B;letter-spacing:.7px}</style>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#5A5D6B"/></marker><marker id="green" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#2E7D4F"/></marker>
  </defs>
  <rect width="1440" height="760" fill="#FAF9F5"/>
  <text class="h" x="72" y="78" font-size="38" font-weight="750" letter-spacing="-.8">A conclusion crosses only one gate</text>
  <text class="s" x="72" y="112" font-size="18">Evaluation can recommend. The configured admission gate alone authorizes reuse.</text>
  <line x1="72" y1="164" x2="1368" y2="164" stroke="#E3E1D9" stroke-width="2"/>

  <g>
    <rect x="72" y="236" width="216" height="160" rx="10" fill="#E3EEF0" stroke="#0E5E6F" stroke-width="1.8"/><text class="m" x="94" y="270" font-size="11" font-weight="700" fill="#0E5E6F">01 · EVIDENCE</text><text class="h" x="94" y="315" font-size="21" font-weight="700">Bound evidence</text><text class="s" x="94" y="345" font-size="15">source · version · digest</text><text class="s" x="94" y="369" font-size="15">locator · scope</text>
    <rect x="332" y="236" width="216" height="160" rx="10" fill="#E3EEF0" stroke="#0E5E6F" stroke-width="1.8"/><text class="m" x="354" y="270" font-size="11" font-weight="700" fill="#0E5E6F">02 · CANDIDATE</text><text class="h" x="354" y="315" font-size="21" font-weight="700">Propose</text><text class="s" x="354" y="345" font-size="15">scoped conclusion</text><text class="s" x="354" y="369" font-size="15">linked evidence</text>
    <rect x="592" y="236" width="216" height="160" rx="10" fill="#F5EEDC" stroke="#8A6210" stroke-width="1.8"/><text class="m" x="614" y="270" font-size="11" font-weight="700" fill="#8A6210">03 · ADVISORY</text><text class="h" x="614" y="315" font-size="21" font-weight="700">Evaluate</text><text class="s" x="614" y="345" font-size="15">integrity · support</text><text class="s" x="614" y="369" font-size="15">policy recommendation</text>
    <rect x="852" y="236" width="216" height="160" rx="10" fill="#F5EEDC" stroke="#8A6210" stroke-width="1.8"/><text class="m" x="874" y="270" font-size="11" font-weight="700" fill="#8A6210">04 · AUTHORITY</text><text class="h" x="874" y="315" font-size="21" font-weight="700">Review / admit</text><text class="s" x="874" y="345" font-size="15">authorized decision</text><text class="s" x="874" y="369" font-size="15">receipt recorded</text>
    <rect x="1112" y="236" width="256" height="160" rx="10" fill="#E7F2EA" stroke="#2E7D4F" stroke-width="1.8"/><text class="m" x="1134" y="270" font-size="11" font-weight="700" fill="#2E7D4F">05 · GOVERNED</text><text class="h" x="1134" y="315" font-size="21" font-weight="700">Project context</text><text class="s" x="1134" y="345" font-size="15">admitted · current</text><text class="s" x="1134" y="369" font-size="15">in scope · actor eligible</text>
  </g>
  <path d="M288 316H316" fill="none" stroke="#5A5D6B" stroke-width="2.5" marker-end="url(#arrow)"/><path d="M548 316H576" fill="none" stroke="#5A5D6B" stroke-width="2.5" marker-end="url(#arrow)"/><path d="M808 316H836" fill="none" stroke="#5A5D6B" stroke-width="2.5" marker-end="url(#arrow)"/>
  <path d="M1068 316H1096" fill="none" stroke="#2E7D4F" stroke-width="2.8" marker-end="url(#green)"/>
  <rect x="840" y="185" width="240" height="30" rx="6" fill="#FFFFFF" stroke="#8A6210"/><text class="m" x="960" y="205" text-anchor="middle" font-size="11" font-weight="700" fill="#8A6210">ADMISSION BOUNDARY</text>
  <path d="M960 215V232" fill="none" stroke="#8A6210" stroke-width="2"/>

  <path d="M960 396V476" fill="none" stroke="#B4453A" stroke-width="2" stroke-dasharray="7 7" marker-end="url(#arrow)"/>
  <rect x="318" y="476" width="848" height="126" rx="10" fill="#F7E9E7" stroke="#B4453A" stroke-width="1.5"/>
  <text class="m" x="346" y="512" font-size="11" font-weight="700" fill="#B4453A">AUDIT HISTORY · EXCLUDED FROM DEFAULT CONTEXT</text>
  <text class="h" x="346" y="551" font-size="20" font-weight="700">rejected · unresolved · expired · superseded · actor-mismatched</text>
  <text class="s" x="346" y="579" font-size="15">These states remain inspectable with their evidence and receipts. They do not become governed context.</text>
  <rect x="72" y="656" width="1296" height="56" rx="9" fill="#FFFFFF" stroke="#E3E1D9"/>
  <text class="h" x="96" y="690" font-size="18" font-weight="700">Evaluation can recommend. Only the configured admission gate authorizes reuse.</text>
  <text class="m" x="1368" y="738" text-anchor="end" font-size="10">PROOFPRESS · VERIFIED KNOWLEDGE LEDGER</text>
</svg>
