<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 760" role="img" aria-labelledby="knowledge-gates-title knowledge-gates-desc">
  <title id="knowledge-gates-title">Three gates before reuse</title>
  <desc id="knowledge-gates-desc">An evidence-bound candidate conclusion passes Deterministic Checks, an LM Judge applying organizational policy, and authorized Human Approval before becoming governed knowledge. Only Human Approval authorizes downstream reuse.</desc>
  <defs>
    <style>
      .sans { font-family: "Geist", -apple-system, BlinkMacSystemFont, "Segoe UI", Arial, sans-serif; }
      .mono { font-family: "Geist Mono", ui-monospace, SFMono-Regular, Menlo, monospace; }
    </style>
    <marker id="knowledge-gates-arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#5a5d6b"/>
    </marker>
    <marker id="knowledge-gates-arrow-green" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#2e7d4f"/>
    </marker>
    <marker id="knowledge-gates-arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#2e5aa8"/>
    </marker>
  </defs>

  <rect width="1440" height="760" fill="#faf9f5"/>
  <text class="sans" x="72" y="64" fill="#20222b" font-size="32" font-weight="600">Three gates before reuse</text>
  <text class="sans" x="72" y="100" fill="#5a5d6b" font-size="16">Candidate conclusion → Deterministic Checks → LM Judge → Human Approval → Governed knowledge</text>
  <line x1="72" y1="144" x2="1368" y2="144" stroke="#e3e1d9" stroke-width="1"/>

  <!-- Connectors are drawn before nodes. -->
  <line x1="280" y1="312" x2="296" y2="312" stroke="#5a5d6b" stroke-width="2" marker-end="url(#knowledge-gates-arrow)"/>
  <line x1="544" y1="312" x2="560" y2="312" stroke="#5a5d6b" stroke-width="2" marker-end="url(#knowledge-gates-arrow)"/>
  <line x1="808" y1="312" x2="824" y2="312" stroke="#5a5d6b" stroke-width="2" marker-end="url(#knowledge-gates-arrow)"/>
  <line x1="1072" y1="312" x2="1088" y2="312" stroke="#2e7d4f" stroke-width="2" marker-end="url(#knowledge-gates-arrow-green)"/>
  <path d="M424 400 V472" fill="none" stroke="#8a8d98" stroke-width="1" stroke-dasharray="4 4"/>
  <path d="M688 400 V472" fill="none" stroke="#8a8d98" stroke-width="1" stroke-dasharray="4 4"/>
  <path d="M952 400 V472" fill="none" stroke="#8a8d98" stroke-width="1" stroke-dasharray="4 4"/>

  <rect x="72" y="220" width="208" height="180" rx="8" fill="#e3eef0" stroke="#0e5e6f" stroke-width="1"/>
  <text class="mono" x="92" y="252" fill="#0e5e6f" font-size="8" font-weight="600" letter-spacing="1">CANDIDATE</text>
  <text class="sans" x="92" y="296" fill="#20222b" font-size="16" font-weight="600">Conclusion + evidence</text>
  <text class="mono" x="92" y="336" fill="#5a5d6b" font-size="12">claim · source · scope</text>
  <text class="mono" x="92" y="364" fill="#5a5d6b" font-size="12">version · digest · locator</text>

  <rect x="304" y="220" width="240" height="180" rx="8" fill="#ffffff" stroke="#0e5e6f" stroke-width="1"/>
  <text class="mono" x="324" y="252" fill="#0e5e6f" font-size="8" font-weight="600" letter-spacing="1">GATE 1</text>
  <text class="sans" x="324" y="296" fill="#20222b" font-size="16" font-weight="600">Deterministic Checks</text>
  <text class="mono" x="324" y="336" fill="#5a5d6b" font-size="12">rules · required inputs</text>
  <text class="mono" x="324" y="364" fill="#5a5d6b" font-size="12">PASS / FAIL</text>

  <rect x="568" y="220" width="240" height="180" rx="8" fill="#ffffff" stroke="#8a6210" stroke-width="1"/>
  <text class="mono" x="588" y="252" fill="#8a6210" font-size="8" font-weight="600" letter-spacing="1">GATE 2</text>
  <text class="sans" x="588" y="296" fill="#20222b" font-size="16" font-weight="600">LM Judge</text>
  <text class="mono" x="588" y="336" fill="#5a5d6b" font-size="12">organizational policy</text>
  <text class="mono" x="588" y="364" fill="#5a5d6b" font-size="12">POLICY MATCH / ESCALATE</text>

  <rect x="832" y="220" width="240" height="180" rx="8" fill="#f5eedc" stroke="#8a6210" stroke-width="1"/>
  <text class="mono" x="852" y="252" fill="#8a6210" font-size="8" font-weight="600" letter-spacing="1">GATE 3 · AUTHORITY</text>
  <text class="sans" x="852" y="296" fill="#20222b" font-size="16" font-weight="600">Human Approval</text>
  <text class="mono" x="852" y="336" fill="#5a5d6b" font-size="12">authorized decision</text>
  <text class="mono" x="852" y="364" fill="#5a5d6b" font-size="12">ADMIT / REJECT</text>

  <rect x="1096" y="220" width="272" height="180" rx="8" fill="#e7f2ea" stroke="#2e7d4f" stroke-width="1"/>
  <text class="mono" x="1116" y="252" fill="#2e7d4f" font-size="8" font-weight="600" letter-spacing="1">GOVERNED</text>
  <text class="sans" x="1116" y="296" fill="#20222b" font-size="16" font-weight="600">Reusable knowledge</text>
  <text class="mono" x="1116" y="336" fill="#5a5d6b" font-size="12">admitted · current · scoped</text>
  <text class="mono" x="1116" y="364" fill="#5a5d6b" font-size="12">eligible for downstream use</text>

  <rect x="304" y="472" width="768" height="112" rx="8" fill="#f3f1ec" stroke="#b9b6ad" stroke-width="1"/>
  <text class="mono" x="328" y="508" fill="#5a5d6b" font-size="8" font-weight="600" letter-spacing="1">AUDITABLE · NOT ADMITTED</text>
  <text class="sans" x="328" y="544" fill="#20222b" font-size="16" font-weight="600">failed · blocked · escalated · rejected</text>
  <text class="sans" x="328" y="568" fill="#5a5d6b" font-size="12">Evidence and receipts remain inspectable, but the conclusion is excluded from reusable context.</text>

  <rect x="72" y="628" width="1296" height="64" rx="8" fill="#ffffff" stroke="#e3e1d9" stroke-width="1"/>
  <text class="sans" x="96" y="668" fill="#20222b" font-size="16" font-weight="600">Deterministic Checks verify required evidence. LM Judge applies organizational policy. Only Human Approval authorizes reuse.</text>
  <text class="mono" x="1368" y="732" text-anchor="end" fill="#5a5d6b" font-size="8" letter-spacing="1">PROOFPRESS · GOVERNANCE FOR AGENT-PRODUCED KNOWLEDGE</text>
</svg>
