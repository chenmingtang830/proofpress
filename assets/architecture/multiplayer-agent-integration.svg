<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="760" viewBox="0 0 1440 760" role="img" aria-labelledby="title desc">
  <title id="title">Proofpress in a multiplayer AI coworker workflow</title>
  <desc id="desc">A platform-neutral example. A Slack or Teams thread is handled by an AI coworker that owns work and wiki experience. A selected update is proposed to Proofpress, which binds the thread and evidence, records checks and review, then returns admitted current context only to a later agent.</desc>
  <defs>
    <style>.h{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif;fill:#20222B}.s{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif;fill:#5A5D6B}.m{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;fill:#5A5D6B;letter-spacing:.7px}</style><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#5A5D6B"/></marker><marker id="green" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#2E7D4F"/></marker>
  </defs>
  <rect width="1440" height="760" fill="#FAF9F5"/>
  <text class="h" x="72" y="78" font-size="34" font-weight="750" letter-spacing="-.7">A coworker keeps the workspace</text>
  <text class="s" x="72" y="112" font-size="18">Proofpress records why selected updates may be safely inherited. This is a platform-neutral integration shape, not a production connector or partner claim.</text>
  <line x1="72" y1="164" x2="1368" y2="164" stroke="#E3E1D9" stroke-width="2"/>

  <rect x="72" y="226" width="224" height="182" rx="10" fill="#FFFFFF" stroke="#E3E1D9" stroke-width="1.8"/><text class="m" x="94" y="260" font-size="11" font-weight="700" fill="#0E5E6F">HOST THREAD</text><text class="h" x="94" y="302" font-size="21" font-weight="700">Slack or Teams</text><text class="s" x="94" y="333" font-size="15">question · task · handoff</text><text class="s" x="94" y="357" font-size="15">conversation stays local</text>
  <rect x="350" y="226" width="224" height="182" rx="10" fill="#FFFFFF" stroke="#E3E1D9" stroke-width="1.8"/><text class="m" x="372" y="260" font-size="11" font-weight="700" fill="#0E5E6F">HOST WORKER</text><text class="h" x="372" y="302" font-size="21" font-weight="700">AI coworker</text><text class="s" x="372" y="333" font-size="15">tools · workflow · state</text><text class="s" x="372" y="357" font-size="15">result or update proposed</text>
  <rect x="628" y="198" width="330" height="238" rx="12" fill="#E3EEF0" stroke="#0E5E6F" stroke-width="2.3"/><text class="m" x="652" y="233" font-size="11" font-weight="700" fill="#0E5E6F">SELECTED TRUST RECORD</text><text class="h" x="652" y="275" font-size="23" font-weight="700">Proofpress</text><text class="s" x="652" y="307" font-size="15">bind source thread + evidence</text><text class="s" x="652" y="333" font-size="15">evaluate, review, record receipt</text><rect x="652" y="360" width="282" height="46" rx="7" fill="#E7F2EA" stroke="#2E7D4F"/><text class="m" x="670" y="380" font-size="10" font-weight="700" fill="#2E7D4F">AFTER ADMISSION</text><text class="h" x="670" y="397" font-size="14" font-weight="700">current · scoped · actor eligible</text>
  <rect x="1012" y="226" width="356" height="182" rx="10" fill="#FFFFFF" stroke="#E3E1D9" stroke-width="1.8"/><text class="m" x="1034" y="260" font-size="11" font-weight="700" fill="#2E7D4F">LATER RUN</text><text class="h" x="1034" y="302" font-size="21" font-weight="700">Next human or agent</text><text class="s" x="1034" y="333" font-size="15">receives admitted/current context only</text><text class="s" x="1034" y="357" font-size="15">may inspect lineage and apply local policy</text>
  <path d="M296 317H330" fill="none" stroke="#5A5D6B" stroke-width="2.5" marker-end="url(#arrow)"/><path d="M574 317H608" fill="none" stroke="#5A5D6B" stroke-width="2.5" marker-end="url(#arrow)"/><path d="M958 317H992" fill="none" stroke="#2E7D4F" stroke-width="2.5" marker-end="url(#green)"/>
  <text class="m" x="591" y="292" text-anchor="middle" font-size="10">SELECTED UPDATE</text><text class="m" x="975" y="292" text-anchor="middle" font-size="10" fill="#2E7D4F">CONTEXT</text>

  <rect x="72" y="512" width="1296" height="136" rx="10" fill="#FFFFFF" stroke="#E3E1D9" stroke-width="1.5"/>
  <text class="m" x="96" y="546" font-size="11" font-weight="700" fill="#0E5E6F">OWNERSHIP STAYS SEPARATE</text>
  <text class="h" x="96" y="583" font-size="18" font-weight="700">The coworker owns the thread, tools, workflow, and wiki UX. The wiki remains the workspace.</text>
  <text class="s" x="96" y="615" font-size="16">Proofpress owns only the selected trust record and lifecycle: why a specific update is safe to inherit, not the host’s whole memory or orchestration layer.</text>
  <text class="m" x="1368" y="714" text-anchor="end" font-size="10">PROOFPRESS · VERIFIED KNOWLEDGE LEDGER</text>
</svg>
