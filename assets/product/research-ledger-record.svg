<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 900" role="img" aria-labelledby="research-ledger-title research-ledger-description">
  <title id="research-ledger-title">Illustrative Proofpress Intelligence Ledger record for a research team</title>
  <desc id="research-ledger-description">Experimentation, evaluation, and analysis agents propose research claims with evidence. Human Approval admits a scoped Harness B conclusion for declared next-experiment reuse.</desc>
  <rect width="1440" height="900" fill="#FFFFFF"/>
  <g font-family="Arial, Helvetica, sans-serif">
    <text x="72" y="78" fill="#0E6675" font-size="16" font-weight="700" letter-spacing="2">PROOFPRESS / ILLUSTRATIVE RESEARCH RECORD</text>
    <text x="72" y="134" fill="#181A20" font-size="47" font-weight="700" letter-spacing="-1.5">The Intelligence Ledger</text>
    <text x="72" y="169" fill="#555B66" font-size="20">Evidence, scope, approval, use, and outcomes stay attached to a research conclusion.</text>
  </g>
  <rect x="72" y="214" width="1296" height="604" fill="#FFFFFF" stroke="#181A20" stroke-width="2"/>
  <g fill="none" stroke="#0E6675" stroke-width="2.5" stroke-linecap="round">
    <path d="M448 360H816"/>
    <path d="M832 712H464"/>
  </g>
  <path d="M832 360L816 352V368Z" fill="#0E6675"/>
  <path d="M448 712L464 704V720Z" fill="#0E6675"/>
  <g font-family="Arial, Helvetica, sans-serif">
    <rect x="520" y="304" width="240" height="40" fill="#FFFFFF"/>
    <text x="640" y="320" fill="#0E6675" font-size="12" font-weight="700" letter-spacing="1.2" text-anchor="middle">PROPOSE CLAIMS + EVIDENCE</text>
    <text x="640" y="340" fill="#555B66" font-size="12" font-weight="600" text-anchor="middle">MCP · CLI · PYTHON · HTTP</text>
    <rect x="576" y="668" width="224" height="28" fill="#FFFFFF"/>
    <text x="688" y="688" fill="#0E6675" font-size="12" font-weight="700" letter-spacing="1.2" text-anchor="middle">GOVERNED CONTEXT</text>
  </g>
  <g font-family="Arial, Helvetica, sans-serif">
    <text x="120" y="294" fill="#0E6675" font-size="14" font-weight="700" letter-spacing="1.7">ANY AGENT</text>
    <rect x="120" y="326" width="314" height="72" fill="#FFFFFF" stroke="#D7DCD9" stroke-width="2"/>
    <rect x="120" y="416" width="314" height="72" fill="#FFFFFF" stroke="#D7DCD9" stroke-width="2"/>
    <rect x="120" y="506" width="314" height="72" fill="#FFFFFF" stroke="#D7DCD9" stroke-width="2"/>
    <text x="142" y="370" fill="#181A20" font-size="22" font-weight="700">Experimentation</text>
    <text x="142" y="460" fill="#181A20" font-size="22" font-weight="700">Evaluation</text>
    <text x="142" y="550" fill="#181A20" font-size="22" font-weight="700">Analysis</text>
    <text x="120" y="630" fill="#555B66" font-size="15">Research cycle</text>
    <text x="120" y="655" fill="#555B66" font-size="15">New evidence can narrow, replace, or retire a conclusion.</text>
  </g>
  <g>
    <rect x="842" y="274" width="426" height="454" fill="#FFFFFF" stroke="#181A20" stroke-width="2" transform="translate(34 -34)"/>
    <rect x="842" y="274" width="426" height="454" fill="#FFFFFF" stroke="#181A20" stroke-width="2" transform="translate(17 -17)"/>
    <rect x="842" y="274" width="426" height="454" fill="#FFFFFF" stroke="#181A20" stroke-width="2"/>
    <rect x="842" y="274" width="426" height="62" fill="#FFFFFF" stroke="#D7DCD9" stroke-width="2"/>
    <rect x="862" y="290" width="28" height="28" fill="#FFFFFF" stroke="#0E6675" stroke-width="2"/>
    <circle cx="887" cy="315" r="6" fill="#0E6675"/>
    <g font-family="Arial, Helvetica, sans-serif">
      <text x="906" y="312" fill="#0E6675" font-size="14" font-weight="700" letter-spacing="1.2">INTELLIGENCE LEDGER</text>
      <text x="1238" y="312" fill="#686F78" font-size="11" font-weight="700" letter-spacing="1" text-anchor="end">LIVE RECORD</text>
      <text x="862" y="364" fill="#686F78" font-size="12" font-weight="700" letter-spacing="1">LR-204 · VERSION 03</text>
      <text x="1248" y="364" fill="#2F6B54" font-size="12" font-weight="700" letter-spacing="1" text-anchor="end">ADMITTED</text>
      <text x="862" y="407" fill="#181A20" font-size="20" font-weight="700">Harness B improved performance</text>
      <text x="862" y="433" fill="#181A20" font-size="20" font-weight="700">on the evaluated task set.</text>
    </g>
    <path d="M842 462H1268" stroke="#181A20" stroke-width="2"/>
    <path d="M984 462V548M1126 462V548" stroke="#D7DCD9" stroke-width="2"/>
    <g font-family="Arial, Helvetica, sans-serif">
      <text x="862" y="490" fill="#0E6675" font-size="11" font-weight="700" letter-spacing="1">EVIDENCE</text>
      <text x="862" y="516" fill="#181A20" font-size="15" font-weight="700">4 sources</text>
      <text x="1004" y="490" fill="#0E6675" font-size="11" font-weight="700" letter-spacing="1">EVALUATION</text>
      <text x="1004" y="516" fill="#181A20" font-size="15" font-weight="700">2 assessments</text>
      <text x="1146" y="490" fill="#0E6675" font-size="11" font-weight="700" letter-spacing="1">SCOPE</text>
      <text x="1146" y="512" fill="#181A20" font-size="12" font-weight="700">Model, data</text>
      <text x="1146" y="530" fill="#181A20" font-size="12" font-weight="700">&amp; harness</text>
    </g>
    <rect x="842" y="548" width="426" height="74" fill="#F4F8F8"/>
    <g font-family="Arial, Helvetica, sans-serif">
      <text x="862" y="578" fill="#0E6675" font-size="11" font-weight="700" letter-spacing="1">HUMAN APPROVAL</text>
      <text x="862" y="603" fill="#181A20" font-size="15" font-weight="700">Admitted for declared reuse: next-experiment planning</text>
    </g>
    <path d="M1055 622V728" stroke="#D7DCD9" stroke-width="2"/>
    <g font-family="Arial, Helvetica, sans-serif">
      <text x="862" y="652" fill="#0E6675" font-size="11" font-weight="700" letter-spacing="1">USED</text>
      <text x="862" y="682" fill="#181A20" font-size="15" font-weight="700">12 runs</text>
      <text x="1076" y="652" fill="#0E6675" font-size="11" font-weight="700" letter-spacing="1">OUTCOMES</text>
      <text x="1076" y="682" fill="#181A20" font-size="15" font-weight="700">5 observations</text>
    </g>
  </g>
  <g font-family="Arial, Helvetica, sans-serif">
    <text x="72" y="861" fill="#686F78" font-size="13">Illustrative record — Human Approval authorizes reuse; evidence and evaluations inform the decision.</text>
    <text x="1368" y="861" fill="#0E6675" font-size="15" font-weight="700" text-anchor="end">Verified. Governed. Cumulative.</text>
  </g>
</svg>
