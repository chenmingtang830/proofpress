<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <style>
      @import url("https://fonts.googleapis.com/css2?family=DM+Sans:wght@500;600;700&family=IBM+Plex+Mono:wght@600&display=swap");
      * { box-sizing: border-box; }
      html, body { width: 1200px; height: 630px; margin: 0; overflow: hidden; }
      body {
        position: relative;
        padding: 64px 68px 50px;
        background: #f8f7f3 url("../public/hero-editorial-v1.webp") center / cover no-repeat;
        color: #181a20;
        font-family: "DM Sans", sans-serif;
      }
      body::after {
        content: "";
        position: absolute;
        inset: 0;
        pointer-events: none;
        background: linear-gradient(90deg, rgba(248,247,243,.98) 0%, rgba(248,247,243,.9) 44%, rgba(248,247,243,.04) 68%);
      }
      main { position: relative; z-index: 1; height: 100%; display: flex; flex-direction: column; }
      header { display: flex; align-items: center; gap: 13px; font-size: 29px; font-weight: 600; }
      header img { width: 38px; height: 38px; }
      h1 { width: 650px; margin: 72px 0 0; font-size: 58px; line-height: 1.03; letter-spacing: -.035em; font-weight: 600; }
      p { width: 570px; margin: 28px 0 0; color: #555b66; font-size: 24px; line-height: 1.35; font-weight: 500; }
      footer { display: flex; gap: 26px; margin-top: auto; color: #58636d; font: 600 15px/1 "IBM Plex Mono", monospace; }
      footer span + span::before { content: "·"; margin-right: 26px; color: #0e6675; }
    </style>
  </head>
  <body>
    <main>
      <header><img src="../public/logo.svg" alt="" />Proofpress</header>
      <h1>Own your intelligence.</h1>
      <p>Verified. Governed. Cumulative.</p>
      <footer><span>Trust infrastructure for RSI</span></footer>
    </main>
  </body>
</html>
