[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "proofpress-local"
version = "0.5.0a2"
description = "Local governance control plane, Python SDK, and self-hosting reference for agent-produced knowledge"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "Apache-2.0"}
authors = [{name = "Proofpress"}]

[project.scripts]
proofpress = "proofpress:main"
proofpress-repo = "proofpress_repo:main"
proofpress-mcp = "proofpress_mcp:main"
proofpress-self-hosted = "proofpress_self_hosted.service:main"
# Backward-compatible alpha command; new documentation uses proofpress-self-hosted.
proofpress-hosted = "proofpress_self_hosted.service:main"
proofpress-remote = "proofpress_self_hosted.remote:main"

[project.optional-dependencies]
mcp = ["mcp>=2,<3"]

[tool.setuptools]
py-modules = [
  "proofpress",
  "proofpress_evidence",
  "proofpress_experiment",
  "proofpress_knowledge",
  "proofpress_repo",
  "proofpress_sdk",
  "proofpress_service",
  "proofpress_mcp",
  "proofpress_event_store",
]

[tool.setuptools.packages.find]
include = ["proofpress_self_hosted*"]
