[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "proofpress-local"
version = "0.5.0a2"
description = "Local governance control plane and Python SDK for agent-produced knowledge"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "Apache-2.0"}
authors = [{name = "Proofpress"}]

[project.scripts]
proofpress = "proofpress:main"
proofpress-repo = "proofpress_repo:main"
proofpress-mcp = "proofpress_mcp:main"
proofpress-hosted = "proofpress_hosted_service:main"
proofpress-remote = "proofpress_remote:main"

[project.optional-dependencies]
mcp = ["mcp>=2,<3"]

[tool.setuptools]
py-modules = [
  "proofpress",
  "proofpress_evidence",
  "proofpress_knowledge",
  "proofpress_repo",
  "proofpress_sdk",
  "proofpress_service",
  "proofpress_mcp",
  "proofpress_event_store",
  "proofpress_hosted",
  "proofpress_hosted_service",
  "proofpress_remote",
]
