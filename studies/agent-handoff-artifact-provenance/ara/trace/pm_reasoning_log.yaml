  - turn: "2026-08-13_001#3"
    notes:
      - "Routed the user's motivation requirement as decision N12 because it changes the public causal narrative rather than introducing a new empirical claim."
      - "Used primary research, standards, and product documentation to establish handoff practice, handoff-boundary failures, document revision identity, and up-to-date validation as adjacent evidence."
      - "Did not claim prior work already proves the exact Proofpress failure; framed the contribution as testing the intersection that prior handoff studies often remove by freezing the repository."
      - "Reported end-to-end overhead descriptively and did not attribute carrier, tool-loop, and extra-turn costs to deterministic verification alone."
      - "Retained the ARA Level 1 failure as legacy schema debt rather than fabricating training/config files inappropriate to this evaluation."
  - turn: "2026-08-13_001#2"
    notes:
      - "Recompiled the full external paper around artifact provenance after the user rejected VBAP as the product-level category."
      - "Replaced the hypothetical introduction with primary-literature positioning, then derived the scoped gap before introducing Proofpress."
      - "Ordered Results by evidence strength and added main-text tables for study design, per-model admission, source-visibility boundaries, selective recovery, and continuity."
      - "Kept run failures and invalid paths in the appendices and retained the broad clean-quality null in the main text as a claim boundary."
  - turn: "2026-08-13_001#1"
    notes:
      - "Routed the protocol-centered framing as decision N11 because the user explicitly chose it over the internal-summary narrative."
      - "Staged O11 and crystallized it to K11 via artifact commitment after PAPER.md and architecture.md were made dependent on the definition."
      - "Kept the novelty claim scoped: prior work establishes provenance and consume-time admission primitives; the claimed delta is their joint evaluation at an agent handoff under external artifact drift."
      - "Ran ARA Level 1 and did not run Level 2 because the legacy ARA layers still fail the current structural prerequisite."
  - turn: "2026-08-10_apex-direct#3"
    notes:
      - "Post-run trajectory audit found the C2 clean stop was induced by a receiver-visible harness-only synthetic capsule.json, not valid Proofpress carrier verification."
      - "Reclassified v1 as invalid for clean-path efficacy and false-stop estimation while preserving its observed fault actions as operational evidence."
      - "Require a carrier-only v2 package and real-overlay inspect/import/verify qualification before expanded repeats."
  - turn: "2026-08-10_apex-direct#2"
    notes:
      - "Completed the frozen 18-cell C0/C1/C2 matrix with byte-identical ordinary C1/C2 handoff text and C2-only verifiable provenance."
      - "Primary analysis separates pre-edit admission correctness from downstream native quality: clean false rejections and agent step-limit outcomes remain task-completion failures, not fabricated native zeros."
      - "Observed C2 fault detection in all three repeats while C0/C1 proceeded unsafely in all three; retain the downstream comparison as conditional and bounded rather than claim general efficacy."
  - turn: "2026-08-10_v4#1"
    notes:
      - "Preserved v3-r2 as frozen descriptive evidence: its static C1/C2 packaging cannot establish temporal agent-operated Proofpress value."
      - "Adopted sparse conventional continuity as the primary C1 baseline; C1-rich is archived rather than used to dilute the treatment contrast."
      - "Required A to create temporal current, superseded, and rejected states with real Proofpress CLI snapshots in C2, and B to inspect, import, verify, and snapshot after a valid continuation."
      - "Separated DOCX criterion denominators for expected continuation from safe-refusal scoring, so a correct rejection is not reclassified as document failure."
      - "Set a no-scale gate requiring predeclared C2 clean-path criterion improvement and no unsafe continuation."
  - turn: "2026-08-06_001#1"
    notes:
      - "Recorded the user-approved Harvey-first scope and fixed centralized workflow as direct decisions."
      - "Marked empirical claims as testing, not supported: no benchmark treatment run has occurred."
      - "Recorded Pi as a deferred dead end because it would add a harness factor, not because a second-harness replication is invalid."
      - "Kept ARA outside experimental treatment; it manages study reasoning and evidence only."
      - "Added configuration templates but left model IDs unresolved so current provider labels cannot be selected after results are known."
      - "Recorded the claims-baseline mismatch as an operational provenance note rather than rewriting history to manufacture a passing verification."
  - turn: "2026-08-06_001#2"
    notes:
      - "Replaced the version-chain primary comparator with a strong ordinary-memory control, while keeping raw browseable history as a secondary efficiency comparator."
      - "Separated an isolated receiver-only diagnostic from the primary end-to-end V0-V4 workflow so causal mechanism and cumulative systems effects are not conflated."
      - "Specified one homogeneous high-effort model team per workflow slice; mixed coordinator/worker models are reserved for a later deployment study, not the core causal matrix."
      - "Specified OpenRouter as a transparent model transport only: concrete slugs, pinned provider routing, disabled fallback, and recorded resolved metadata."
      - "Recorded user-priority candidates DeepSeek V4 Flash, Qwen 3.8, and Muse Spark 1.2 as freeze-time candidates, not results-bearing selections."
