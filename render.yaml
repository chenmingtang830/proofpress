services:
  - type: web
    # Compatibility ID for the existing Render service. The public product
    # name remains "Self-hosted Proofpress".
    name: proofpress-personal-hosted
    runtime: python
    plan: starter
    region: oregon
    branch: main
    buildCommand: pip install .
    startCommand: proofpress hosted --database /var/data/proofpress.db serve --host 0.0.0.0 --allow-public-bind
    healthCheckPath: /readyz
    # A self-hosted operator chooses when to adopt upstream changes.
    autoDeployTrigger: off
    disk:
      name: proofpress-data
      mountPath: /var/data
      sizeGB: 1
    envVars:
      - key: PYTHON_VERSION
        value: 3.13.7
      # Non-secret model routing. Add OPENROUTER_API_KEY as a secret in the
      # Render dashboard; never commit it to this Blueprint.
      - key: OPENROUTER_MODEL
        value: openai/gpt-5.4-mini
